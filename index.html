:root{--navy:#0b1a4a;--amber:#ffb84d;--bg:#f4f6fb;--card:#fff;--ink:#16203d;--mute:#5d6785;--line:#d9deee;--err:#b3261e;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1230;--card:#111c44;--ink:#eef1fb;--mute:#a4aed0;--line:#26346b;--err:#ff8a80}}
:root[data-theme="dark"]{--bg:#0a1230;--card:#111c44;--ink:#eef1fb;--mute:#a4aed0;--line:#26346b;--err:#ff8a80}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Montserrat,system-ui,sans-serif;line-height:1.5}
header{background:var(--navy);border-bottom:6px solid var(--amber);padding:28px 20px 30px;text-align:center;color:#fff}
header h1{margin:0 0 6px;font-size:clamp(22px,4.5vw,34px);font-weight:700}
header p{margin:0;color:#c9d2f2;font-size:15px}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.search{display:flex;gap:10px}
.search input{flex:1;min-width:0;padding:15px 16px;font:inherit;font-size:17px;border:2px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
.search input:focus{outline:3px solid var(--amber);border-color:var(--navy)}
.hint{color:var(--mute);font-size:14px;margin:10px 2px 20px}
.results{display:grid;gap:10px}
.row{display:flex;align-items:center;gap:12px;justify-content:space-between;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.row b{font-size:16px}.row small{display:block;color:var(--mute)}
button{font:inherit;font-weight:600;cursor:pointer;border-radius:8px;border:2px solid var(--navy);padding:9px 14px;background:var(--navy);color:#fff}
button.alt{background:transparent;color:var(--navy)}
:root[data-theme="dark"] button.alt,:root:not([data-theme="light"]) button.alt{color:var(--amber);border-color:var(--amber)}
button:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.msg{padding:18px;border:1px dashed var(--line);border-radius:10px;color:var(--mute)}
.msg.err{color:var(--err);border-color:var(--err)}
#preview{margin-top:28px;display:none}
#preview h2{font-size:18px;margin:0 0 12px}
#cv{width:100%;height:auto;border:1px solid var(--line);border-radius:6px;background:#fff;display:block}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
footer{text-align:center;color:var(--mute);font-size:13px;padding:0 18px 30px}
</style>
</head>
<body>
<header>
  <h1>Download your certificate</h1>
  <p>5-Day Hands-on Workshop on Internet of Things &amp; Artificial Intelligence</p>
</header>
<main>
  <div class="search">
    <input id="q" type="search" placeholder="Type your full name" autocomplete="off" aria-label="Search your name">
  </div>
  <p class="hint">Type at least 3 letters of your name, exactly as you registered.</p>
  <div id="results" class="results" aria-live="polite"></div>
  <section id="preview">
    <h2 id="pname"></h2>
    <canvas id="cv" width="2000" height="1414"></canvas>
    <div class="actions">
      <button id="dlPng">Download PNG</button>
      <button id="dlPdf" class="alt">Download PDF</button>
    </div>
  </section>
</main>
<footer>Name missing or misspelled? Contact NovaTech Innovative Solutions with your registered name.</footer>

const TEMPLATE_SRC = "../img.jpg"
const NAME_X = 1000, NAME_Y = 758, MAX_W = 1250; // position on the blank line of the template
const $ = id => document.getElementById(id);
const cv = $("cv"), ctx = cv.getContext("2d");
const tpl = new Image();
const tplReady = new Promise(r => { tpl.onload = r; tpl.src = TEMPLATE_SRC; });
let current = null;

const norm = s => s.toLowerCase().replace(/[^a-z0-9 ]/g,"").replace(/\s+/g," ").trim();

function render(){
  $("results").innerHTML = "";
  const q = norm($("q").value);
  if(q.length < 3){ return; }
  const hits = STUDENTS.filter(s => norm(s.name).includes(q)).slice(0,20);
  if(!hits.length){
    $("results").innerHTML = '<div class="msg err">No certificate found for "'+esc($("q").value.trim())+'". Check the spelling or contact the organisers.</div>';
    return;
  }
  hits.forEach(s => {
    const d = document.createElement("div"); d.className = "row";
    d.innerHTML = '<div><b>'+esc(s.name)+'</b>'+(s.dept?'<small>'+esc(s.dept)+'</small>':'')+'</div>';
    const b = document.createElement("button"); b.textContent = "View certificate";
    b.onclick = () => show(s);
    d.appendChild(b); $("results").appendChild(d);
  });
}
function esc(t){return t.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}

async function show(s){
  current = s;
  await tplReady;
  try{ await document.fonts.load('italic 600 90px "Playfair Display"'); }catch(e){}
  ctx.drawImage(tpl,0,0,2000,1414);
  let size = 96;
  const fam = '"Playfair Display", Georgia, serif';
  do{ ctx.font = 'italic 600 '+size+'px '+fam; size -= 2; }while(ctx.measureText(s.name).width > MAX_W && size > 40);
  ctx.fillStyle = "#0b1a4a"; ctx.textAlign = "center"; ctx.textBaseline = "alphabetic";
  ctx.fillText(s.name, NAME_X, NAME_Y);
  $("pname").textContent = "Certificate for " + s.name;
  $("preview").style.display = "block";
  $("preview").scrollIntoView({behavior:"smooth",block:"start"});
}
const fname = ext => "Certificate_" + current.name.replace(/\s+/g,"_") + "." + ext;

$("dlPng").onclick = () => {
  const a = document.createElement("a");
  a.href = cv.toDataURL("image/png"); a.download = fname("png"); a.click();
};
$("dlPdf").onclick = () => {
  const {jsPDF} = window.jspdf;
  const pdf = new jsPDF({orientation:"landscape",unit:"px",format:[2000,1414]});
  pdf.addImage(cv.toDataURL("image/jpeg",0.95),"JPEG",0,0,2000,1414);
  pdf.save(fname("pdf"));
};
$("q").addEventListener("input", () => { $("preview").style.display="none"; render(); });
